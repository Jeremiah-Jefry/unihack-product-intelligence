[alembic]
script_location = alembic
prepend_sys_path = .

# sqlalchemy.url is overridden in env.py from the DATABASE_URL environment variable.
# This fallback is only used if the env var is not set.
sqlalchemy.url = sqlite:///./data/storage/product_intelligence.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
